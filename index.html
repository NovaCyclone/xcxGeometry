
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox for xcx</title>

<style>
    
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #202b3c;
    --sub: #788397;
    --primary: #5278d9;
    --border: #e8edf5;
}

body {
    font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* 顶部导航 */

header {
    height: 68px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8%;
}

.logo {
    font-size: 21px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 1px;
}

nav a {
    text-decoration: none;
    color: #667085;
    margin-left: 28px;
    font-size: 14px;
}

nav a:hover {
    color: var(--primary);
}

/* 主体 */

.container {
    max-width: 1120px;
    margin: auto;
    padding: 45px 25px;
}

/* 欢迎区域 */

.hero {
    background: linear-gradient(120deg, #4268c9, #7598e8);
    color: white;
    padding: 48px 45px;
    border-radius: 16px;
    margin-bottom: 35px;
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 13px;
}

.hero p {
    font-size: 15px;
    opacity: .85;
    line-height: 1.8;
}

/* 搜索框 */

.search-box {
    margin-top: 27px;
    max-width: 550px;
}

.search-box input {
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 9px;
    outline: none;
    font-size: 15px;
    background: white;
}

/* 分类导航 */

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 30px;
}

.category {
    border: 1px solid var(--border);
    background: white;
    padding: 9px 19px;
    border-radius: 20px;
    cursor: pointer;
    color: #667085;
    font-size: 14px;
    transition: .2s;
}

.category:hover,
.category.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

/* 标题 */

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 19px;
}

.section-title h2 {
    font-size: 21px;
}

.section-title span {
    color: var(--sub);
    font-size: 13px;
}

/* 工具卡片 */

.tools-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.tool-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 23px;
    transition: .2s;
    display: flex;
    flex-direction: column;
    min-height: 175px;
}

.tool-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(40,60,100,.08);
    border-color: #b9c9ef;
}

.tool-icon {
    font-size: 27px;
    margin-bottom: 15px;
}

.tool-card h3 {
    font-size: 17px;
    margin-bottom: 9px;
}

.tool-card p {
    font-size: 13px;
    color: var(--sub);
    line-height: 1.7;
    flex: 1;
}

.tool-card a {
    display: inline-block;
    margin-top: 17px;
    color: var(--primary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}

.tool-card a:hover {
    text-decoration: underline;
}

.empty {
    text-align: center;
    padding: 50px;
    color: var(--sub);
    display: none;
}

/* 页脚 */

footer {
    text-align: center;
    padding: 35px 15px;
    color: #98a2b3;
    font-size: 13px;
    margin-top: 50px;
    border-top: 1px solid var(--border);
}

/* 手机适配 */

@media (max-width: 750px) {
    header {
        padding: 0 5%;
    }

    .container {
        padding: 25px 17px;
    }

    .hero {
        padding: 35px 25px;
    }

    .hero h1 {
        font-size: 26px;
    }

    .tools-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .tool-card {
        padding: 17px;
    }
}

@media (max-width: 430px) {
    .tools-grid {
        grid-template-columns: 1fr;
    }

    nav a {
        margin-left: 12px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- 顶部导航 -->

<header>
    <div class="logo">TOOLBOX FOR XCX</div>
    <nav>
        <a href="index.html">首页</a>
        <a href="#tools">工具</a>
        <a href="#about">关于</a>
    </nav>
</header>

<main class="container">

    <!-- 欢迎区域 -->

    <section class="hero">
        <h1>一个简单的工具箱</h1>
        <p>
            整理实用的在线工具，让计算、学习与工作更加方便。
            <br>
            Simple tools, efficient work.
        </p>

        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="搜索工具名称或功能..."
            >
        </div>
    </section>

    <!-- 分类 -->

    <div class="categories">
        <button class="category active" data-category="全部">全部工具</button>
        <button class="category" data-category="距离">计算距离、长度</button>
        <button class="category" data-category="图形">图形工具</button>
        <button class="category" data-category="圆锥曲线">圆锥曲线</button>
        <button class="category" data-category="其他">其他工具</button>
    </div>

    <!-- 工具列表 -->

    <section id="tools">

        <div class="section-title">
            <h2>工具列表</h2>
            <span id="count">0 个工具</span>
        </div>

        <div class="tools-grid" id="toolGrid"></div>

        <div class="empty" id="empty">
            没有找到相关工具
        </div>

    </section>

</main>

<footer id="about">
    <p>TOOLBOX FOR XCX</p>
    <p style="margin-top:8px">
        Designed for convenience.
    </p>
    <p><a href = "https://novacyclone.github.io/NovacyclonePersonalGateway/">关于我们</a></p>
</footer>

<script>

// ==================================
// 工具配置区：在这里添加或修改工具
// ==================================

const tools = [

    {
        name: "普通计算器",
        icon: "📐",
        category: "其他",
        description: "一个正常的计算器……",
        url: "monomial.html"
    },

    {
        name: "多项式求导",
        icon: "📈",
        category: "其他",
        description: "对含参多项式求导，或对指定参数求偏导，支持幂、根式与分式",
        url: "derivative.html"
    },

    {
        name: "拉格朗日乘数法",
        icon: "🎯",
        category: "其他",
        description: "输入目标函数 f(x,y) 与约束 g(x,y)=0，构造拉格朗日函数并求偏导，输出拉格朗日方程组",
        url: "lagrange.html"
    },

    {
        name: "平面两点距离",
        icon: "🧮",
        category: "距离",
        description: "计算平面上两点距离",
        url: "distance2.html"
    },

    {
        name: "空间两点距离",
        icon: "🧮",
        category: "距离",
        description: "计算空间里两点距离",
        url: "distance3.html"
    },

    {
        name: "平面点线距离",
        icon: "⚛️",
        category: "距离",
        description: "计算平面点到直线距离",
        url: "linedistance2.html"
    },

    {
        name: "椭圆与直线交点",
        icon: "🥚",
        category: "圆锥曲线",
        description: "计算椭圆（长短轴与坐标轴重合）与直线的两个交点，结果精确输出",
        url: "ellipseline.html"
    },

    {
        name: "抛物线与直线交点",
        icon: "🥚",
        category: "圆锥曲线",
        description: "计算抛物线（长短轴与坐标轴重合）与直线的两个交点，结果精确输出",
        url: "paraline.html"
    },

    {
        name: "双曲线与直线交点",
        icon: "🥚",
        category: "圆锥曲线",
        description: "计算双曲线（长短轴与坐标轴重合）与直线的两个交点，结果精确输出",
        url: "hyperline.html"
    },

    {
        name: "四面体工具",
        icon: "🔄",
        category: "图形",
        description: "计算四面体体积、外接球球心、半径，内切球球心、半径",
        url: "tetrahedron.html"
    },
    

    {
        name: "三角形工具",
        icon: "🔄",
        category: "图形",
        description: "计算三角形面积、外心、内心",
        url: "triangle.html"
    }

];

// ==================================
// 页面渲染
// ==================================

const grid = document.getElementById("toolGrid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

let currentCategory = "全部";

function renderTools() {

    const keyword = search.value.trim().toLowerCase();

    const filtered = tools.filter(tool => {

        const matchCategory =
            currentCategory === "全部" ||
            tool.category === currentCategory;

        const matchSearch =
            tool.name.toLowerCase().includes(keyword) ||
            tool.description.toLowerCase().includes(keyword) ||
            tool.category.toLowerCase().includes(keyword);

        return matchCategory && matchSearch;

    });

    grid.innerHTML = filtered.map(tool => `

        <div class="tool-card">

            <div class="tool-icon">${tool.icon}</div>

            <h3>${tool.name}</h3>

            <p>${tool.description}</p>

            <a href="${tool.url}">
                进入工具 →
            </a>

        </div>

    `).join("");

    count.textContent = filtered.length + " 个工具";

    empty.style.display =
        filtered.length === 0 ? "block" : "none";
}

// 搜索

search.addEventListener("input", renderTools);

// 分类切换

document.querySelectorAll(".category").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelector(".category.active")
            .classList.remove("active");

        button.classList.add("active");

        currentCategory = button.dataset.category;

        renderTools();

    });

});

// 初始化

renderTools();

</script>

</body>
</html>
